[project]
name = "admet-minimol-env"
version = "0.1.0"
description = "Isolated environment for the MiniMol featurizer worker"
requires-python = "==3.11.*"
dependencies = [
    "minimol==1.3.5",
    "graphium==2.4.7",
    "hydra-core",
    "torch==2.3.0",
    "torchvision==0.18.0",
    "torch-geometric==2.5.3",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "numpy<2",
    "scipy<1.15",  # graphium builds float16 sparse matrices, rejected since 1.15
    "setuptools<81",
]

[tool.uv]
package = false
find-links = ["https://data.pyg.org/whl/torch-2.3.0+cpu.html"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
