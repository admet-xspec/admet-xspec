[project]
name = "admet-xspec"
version = "1.1.0"
description = "A Tool for Systematic Cross-Species Data Integration in ADMET Prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "filelock",
    "gin-config==0.5.0",
    "joblib",
    "lightgbm==4.6.0",
    "numpy==2.3.3",
    "optuna>=4.8.0",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "rdkit==2025.3.6",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "threadpoolctl==3.7.0",
    "toml>=0.10.2",
    "tqdm==4.70.1",
    "xgboost==3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
